<div nbCluster gap="sm" align="end" wrap="wrap" class="border-2 border-black bg-white p-3">
  <label class="flex flex-col gap-1">
    <span class="font-mono text-[11px] font-bold tracking-[0.06em] uppercase">Author</span>
    <input
      nbInput
      type="text"
      [value]="filters().author ?? ''"
      (change)="patch({ author: $any($event.target).value || null })"
    />
  </label>

  <label class="flex flex-col gap-1">
    <span class="font-mono text-[11px] font-bold tracking-[0.06em] uppercase">From</span>
    <input
      nbInput
      type="date"
      [value]="filters().from ?? ''"
      (change)="patch({ from: $any($event.target).value || null })"
    />
  </label>

  <label class="flex flex-col gap-1">
    <span class="font-mono text-[11px] font-bold tracking-[0.06em] uppercase">To</span>
    <input
      nbInput
      type="date"
      [value]="filters().to ?? ''"
      (change)="patch({ to: $any($event.target).value || null })"
    />
  </label>

  <label class="flex flex-col gap-1">
    <span class="font-mono text-[11px] font-bold tracking-[0.06em] uppercase">Flagged</span>
    <select nbSelect [value]="filters().flagged === null ? '' : filters().flagged"
            (change)="onFlagged($any($event.target).value)">
      <option value="">Any</option>
      <option value="true">Flagged only</option>
      <option value="false">Not flagged</option>
    </select>
  </label>

  <label class="flex flex-col gap-1">
    <span class="font-mono text-[11px] font-bold tracking-[0.06em] uppercase">Sort</span>
    <select nbSelect [value]="filters().sort" (change)="onSort($any($event.target).value)">
      <option value="newest">Newest</option>
      <option value="oldest">Oldest</option>
      <option value="most-liked">Most liked</option>
    </select>
  </label>

  <span class="font-mono text-[11px] font-bold tracking-[0.06em] uppercase">
    {{ total() }} results · {{ activeCount() }} filters
  </span>

  @if (activeCount() > 0) {
    <button nbButton tone="white" size="sm" type="button" (click)="clear.emit()">Clear</button>
  }
</div>
